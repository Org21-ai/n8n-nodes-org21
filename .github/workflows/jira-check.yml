name: Jira Check

# VENDORED COPY -- do not edit by hand.
#
# n8n-nodes-org21 is public and Org21-ai/pipelines is private. GitHub does not
# allow a public repo to call a private repo's reusable workflow: the run dies
# before any job starts, with zero jobs and the run named by file path rather
# than by `name:`. This repo's jira-check had been failing that way on every
# event since at least 2026-08-11, so the SOC 2 check had never once executed.
#
# The `check-jira-key` job below is copied verbatim from
# Org21-ai/pipelines/.github/workflows/jira-check.yml. The `vendored_check_stale`
# conformance rule compares this copy's script body against the canonical one on
# every sweep and reports drift, so this file cannot silently fall behind.
#
# To update: re-copy the job from canonical rather than editing here.
#
# Canonical's second job (notify-failure) is deliberately NOT vendored -- it
# calls ./.github/workflows/notify.yml, a path that exists only inside pipelines.
# Failures here are reported by the central ci-watch sweep, which enumerates
# every org repo.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    # This repo's default branch is `master`, so a `[main]`-only filter meant the
    # push handler never fired and commits reached the default branch unchecked.
    branches: [main, master]

# Matches canonical: the push handler calls repos.getCommit once per pushed
# commit to test parent count, which needs contents: read.
permissions:
  contents: read

jobs:
  check-jira-key:
    # A vendored job is not a reusable-workflow call, so it has no caller
    # key to prefix and would publish a bare `check-jira-key`. Setting the
    # display name makes it publish `jira / check-jira-key` -- the name the
    # org ruleset requires (architecture 11.1) -- so this repo needs no
    # ruleset exception despite being the one repo that cannot call the
    # shared workflow.
    name: jira / check-jira-key
    runs-on: ubuntu-latest
    steps:
      - name: Validate Jira Key Presence
        uses: actions/github-script@v7
        with:
          script: |
            const jiraRegex = /\bDEV-[0-9]+\b/;

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const branchName = pr.head.ref;
              const prTitle = pr.title;
              const prBody = pr.body || "";

              if (!jiraRegex.test(branchName) && !jiraRegex.test(prTitle) && !jiraRegex.test(prBody)) {
                core.setFailed("SOC 2 Violation: No DEV-xxx Jira key found in PR title, description, or branch name.");
              } else {
                console.log("Jira reference found.");
              }
            } else if (context.eventName === 'push') {
              const commits = context.payload.commits || [];
              // DEV-2896: exempt merge commits by SHAPE, not by message text. The old
              // regex matched three wordings and missed GitHub's PR merge-test commit
              // ("Merge <sha> into <sha>"), failing a push on a machine-generated
              // commit. Parent count covers every merge form, including ones GitHub
              // has not invented yet. One API call per pushed commit; pushes are small.
              for (const commit of commits) {
                const { data: full } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: commit.id,
                });
                if (full.parents.length > 1) {
                  console.log(`Skipping merge commit ${commit.id.slice(0, 7)} (${full.parents.length} parents).`);
                  continue;
                }
                if (!jiraRegex.test(commit.message)) {
                  core.setFailed(`SOC 2 Violation: Commit ${commit.id.slice(0,7)} missing DEV-xxx Jira key.`);
                  return;
                }
              }
              console.log("All non-merge commits have Jira references.");
            }
