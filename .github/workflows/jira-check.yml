name: Jira Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    # This repo's default branch is `master`, so a `[main]`-only filter meant the
    # push handler never fired and commits reached the default branch unchecked.
    # Both listed, matching src-common-vault and src-common-neo4j, so the check
    # survives a future rename either way.
    branches: [main, master]

jobs:
  jira:
    uses: Org21-ai/pipelines/.github/workflows/jira-check.yml@main
